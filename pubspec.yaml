dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  hive_flutter: ^1.1.0
  fl_chart: ^1.2.0
  dio: ^5.7.0
  xml: ^6.5.0
  flutter_animate: ^4.5.0
  intl: ^0.20.0
  uuid: ^4.4.0
